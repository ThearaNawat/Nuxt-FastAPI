name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd back-end
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd back-end
          pytest
  
  frontend:
    name: Frontend
    run-on: ubuntu:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: Install dependency
        working-directory: front-end
        run: |
          npm ci
      
      - name: Build Nuxt
        working-directory: front-end
        run: |
          npm run build

