apiVersion: v1
kind: ConfigMap

metadata:
  name: backend-config
  namespace: erp

data:
  APP_ENV: "development"
  POSTGRES_HOST: "postgres-service"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "erp_db"
  REDIS_URL: "redis://redis-service:6379/0"
  DATABASE_URL: "postgresql+psycopg://postgres:123456@postgres-service:5432/erp_db"
  