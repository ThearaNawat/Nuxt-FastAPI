apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: erp-ingress
  namespace: erp

spec:

  ingressClassName: alb

  rules:

    - host: myerp.com

      http:

        paths:

          - path: /api

            pathType: Prefix

            backend:

              service:
                name: backend
                port:
                  number: 8000

          - path: /

            pathType: Prefix

            backend:

              service:
                name: frontend
                port:
                  number: 3000