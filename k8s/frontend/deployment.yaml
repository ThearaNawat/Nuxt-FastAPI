apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-deployment
  namespace: erp

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

        - name: frontend

          image: kongtheara/erp-frontend:latest

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 3000

            initialDelaySeconds: 10
            periodSeconds: 10